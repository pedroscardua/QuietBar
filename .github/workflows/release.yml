name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate version and sources
        run: |
          python3 scripts/check_repository.py
          python3 - <<'PY'
          import os, plistlib
          with open('Info.plist', 'rb') as f:
              version = plistlib.load(f)['CFBundleShortVersionString']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - run: ./build.sh
      - run: ./Tests/run_background_checks.sh
      - name: Package original audio build
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/QuietBar.app dist/QuietBar-macOS-arm64.zip
          cd dist
          shasum -a 256 QuietBar-macOS-arm64.zip > SHA256SUMS.txt
      - name: Publish draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "QuietBar $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md dist/QuietBar-macOS-arm64.zip dist/SHA256SUMS.txt
